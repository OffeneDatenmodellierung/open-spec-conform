# The specifications this repository conforms to, and the provenance of the
# bytes it conforms against.
#
# Read by `conform-registry`. Three rules govern what may be written here, and
# each of them exists because of a defect already found in this estate:
#
#  1. `pinned_ref` names ONE immutable upstream revision — a release tag, a
#     version identifier, or a commit SHA. Never `latest`, `main` or `HEAD`.
#     A vendored copy of a moving document, pinned to a moving pointer, cannot
#     be checked against anything: that is exactly what
#     `odps-json-schema-latest.json` was, and a test in `conform-registry`
#     fails the build if the string ever reappears here.
#
#  2. A field nobody could determine is LEFT OUT, and the entry's `notes` says
#     what was looked at and what it did not say. A recorded unknown is usable
#     evidence. A plausible-looking value nobody checked is worse than silence,
#     because it reads as verified.
#
#  3. `sha256` is the digest of the exact bytes at `vendored_path`, and
#     `conform-registry`'s tests re-hash every one of them on every run. The
#     registry cannot drift from the files it describes without CI saying so.
#
# `fetched_at` is the date the bytes entered THIS repository, and the entries
# below fall into three custody classes that a reader has to keep apart.
#
# `odcs`, `odps`, `odcl` and `cads` were copied from `data-modelling-sdk/schemas/`,
# whose own fetch date from upstream is not recorded anywhere in that
# repository. `okf` was copied from `roteiro`, with a hand-written
# `PROVENANCE.md` accompanying it. For those five, the upstream URLs were
# transcribed rather than fetched — they are second-hand evidence, accurate as
# to what this estate believes, unverified as to what upstream currently
# serves — and their `poll.endpoint` values are mechanical GitHub-API
# transforms of the same repository URLs that have never been called. Each
# entry's `notes` says so at the point a reader meets it.
#
# `ossie` is the exception and is marked as such in its own `notes`: its bytes
# were fetched from upstream directly on 2026-09-22 and their digests
# recomputed here afterwards, and every upstream fact recorded for it — the
# tag, the commit, the licence files, the NOTICE — was read at the pinned
# revision rather than taken from a note. That is first-hand evidence, and it
# is the standard the rest of this file should be brought up to rather than an
# exception to it.
#
# None of this happens at validation time. Nothing in `conform-registry`
# performs network access: the fetching above was done by hand, by the person
# writing the entry, which is why what they found is written down here.

schema_version = 2


# ---------------------------------------------------------------------------
# ODCS — the primary data-contract standard in this estate.
# ---------------------------------------------------------------------------
[[spec]]
id            = "odcs"
name          = "Open Data Contract Standard"
homepage      = "https://bitol-io.github.io/open-data-contract-standard/latest/"
repository    = "https://github.com/bitol-io/open-data-contract-standard"
steward       = "Bitol"
notes = """
Version evidence, three independent signals agreeing: the filename; the \
document's `properties.apiVersion.enum`, whose maximum is `v3.1.0` (a schema \
can only enumerate versions that existed when it was written); and \
`data-modelling-sdk/schemas/README.md`, which records "Version: v3.1.0".

The document carries NO `$id`, so the bytes themselves contain no \
machine-readable link back to Bitol. That absence is the reason this file \
exists.

`licence` is deliberately absent: no licence is recorded for this artefact \
anywhere in `data-modelling-sdk` — not in the schema, not in the schemas \
README, not in that repository's LICENSE, which covers its own MIT-licensed \
code and says nothing about vendored third-party schemas. Determining it \
requires reading the upstream repository, which this task did not do. Until \
somebody does, these are bytes of unknown licence sitting in the tree.

`homepage` is Bitol's documentation site as referenced across this estate; \
note it is itself a `/latest/` URL and so tracks whatever Bitol publishes, \
which is fine for a human-facing link and is why the pin lives in \
`pinned_ref` instead. Bitol's own site is `https://bitol.io/`.

Custody chain: copied 2026-09-20 from \
`data-modelling-sdk/schemas/odcs-json-schema-v3.1.0.json`, byte-identical \
(SHA-256 verified on both sides). That file was last touched there by commit \
`2d7c7d22d8ecb5f1d6d718261e2b38e6e81682ee` (2026-01-03); when it was fetched \
from upstream, and from which upstream revision, is recorded nowhere. The pin \
below dates the document; it is not proof of byte-identity with Bitol's \
published `v3.1.0` artefact, which nobody has yet diffed.
"""

  [[spec.pin]]
  version       = "3.1.0"
  pinned_ref    = "v3.1.0"
  vendored_path = "schemas/odcs-json-schema-v3.1.0.json"
  sha256        = "2cb7dd6fe43344d2233e0406438622681dc3ebadcf8f0d606a15b40c8f6752c0"
  fetched_at    = "2026-09-20"

    [spec.pin.poll]
    endpoint = "https://api.github.com/repos/bitol-io/open-data-contract-standard/releases/latest"
    method   = "github-release"
    field    = "tag_name"
    cadence  = "weekly"


