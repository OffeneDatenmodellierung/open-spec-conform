name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Default features first, and on its own. This is the build every
      # consumer gets by default, and the one that must have zero non-std
      # dependencies; running it separately means a regression there cannot be
      # masked by the all-features run that follows.
      - name: cargo test (default features)
        run: cargo test --workspace

      # And with everything on. For `conform-ffi` this is what runs the two
      # test files its manifest gates behind `required-features`: the one that
      # regenerates `conform.h` and fails if the committed copy has drifted
      # (needs `cbindgen`), and the one that compiles a C program against that
      # header and links it against the built library (needs a C compiler).
      # Neither belongs in the default run — see that crate's README.
      - name: cargo test (all features)
        run: cargo test --workspace --all-features

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny

      # Whole workspace, with every feature activated: anything reachable only
      # through an optional feature is otherwise invisible to both the licence
      # and the advisory gate.
      - name: cargo deny (workspace)
        run: cargo deny --all-features check

      # conform-core alone, as its own graph root. Everything in this family
      # sits on top of this crate, so its dependency tree is everybody's — and
      # a workspace-wide run would happily stay green while a heavy dependency
      # added to a sibling (the FFI crate being the obvious future risk) crept
      # into the harness's own tree unnoticed.
      #
      # Pointing --manifest-path at a workspace member makes that crate the
      # sole root of the graph, which is exactly the isolation wanted here.
      - name: cargo deny (conform-core in isolation)
        run: cargo deny --all-features --manifest-path crates/conform-core/Cargo.toml check

      # conform-registry alone, for the same reason one step up: it is the
      # first crate here to take third-party dependencies at all, so the
      # licence and advisory gates need to see its tree as its own graph root
      # rather than blended into the workspace's.
      - name: cargo deny (conform-registry in isolation)
        run: cargo deny --all-features --manifest-path crates/conform-registry/Cargo.toml check

      # conform-okf alone. It is the only crate here that takes a third-party
      # *runtime* dependency of its own — `okf-core`, which no sibling uses —
      # and the whole reason that dependency is affordable is its tree: one
      # crate, nothing transitive. A workspace-wide run blends it into
      # everybody else's graph, where a future version growing dependencies
      # would not stand out.
      - name: cargo deny (conform-okf in isolation)
        run: cargo deny --all-features --manifest-path crates/conform-okf/Cargo.toml check

      # And the two schema-driven adapters, each as its own graph root. These
      # are the first crates here to take a JSON Schema implementation and a
      # YAML parser, so a licence or advisory problem in either arrives
      # through them; seeing their trees separately is what keeps "which
      # crate brought that in?" answerable without reading a blended
      # workspace graph.
      - name: cargo deny (conform-odcs in isolation)
        run: cargo deny --all-features --manifest-path crates/conform-odcs/Cargo.toml check

      - name: cargo deny (conform-odps in isolation)
        run: cargo deny --all-features --manifest-path crates/conform-odps/Cargo.toml check

      # And the FFI crate, which is the one §5.3 names as the standing risk:
      # its natural dependencies — a header generator, a binding generator, a
      # WASM toolchain — are heavy and several are copyleft, and the whole
      # point of it being optional is that none of that reaches anybody else.
      # `cbindgen` is already out of the graph entirely (see tools/headergen);
      # this is what stops the next one coming back in.
      - name: cargo deny (conform-ffi in isolation)
        run: cargo deny --all-features --manifest-path crates/conform-ffi/Cargo.toml check

  sanitise:
    name: sanitise the C boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nightly first and stable second, deliberately: the ASan arm needs
      # `-Zsanitizer=address` and the runtime that ships with nightly, and
      # everything else here — including the non-instrumented build the
      # valgrind arm uses — should be the stable toolchain the rest of CI
      # tests. Installing stable last makes it the default.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind

      # Both arms. This is the job the plan's "valgrind/ASan clean on the C
      # smoke test" exit criterion (§7.2) is satisfied by, and it is on Linux
      # because valgrind is not packaged for Apple silicon — see
      # tools/sanitise/README.md for what a macOS developer can and cannot run
      # locally.
      #
      # The script builds two programs that are supposed to fail and checks
      # that they do, so a checker that silently did not run is a failure here
      # rather than a green tick. It also exits non-zero if nothing ran at all.
      - name: valgrind and AddressSanitizer over the C smoke test
        run: tools/sanitise/run.sh

