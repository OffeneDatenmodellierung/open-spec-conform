# cargo-deny configuration.
#
# Run with `--all-features` in CI (plan §7.3): anything reachable only through an
# optional feature is otherwise invisible to both the licence and advisory gates.
# Also run against `conform-core` in isolation, so a heavier dependency added to
# a sibling crate (notably the future FFI crate) cannot quietly appear in the
# harness's own tree — plan risk R4.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# The house standard is dual MIT OR Apache-2.0, plus the usual permissive set
# that shows up transitively in tooling dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MIT-0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
