# How `include/conform.h` is generated.
#
# Read by `cbindgen::generate` from this crate's directory, which is also where
# `cbindgen` the command-line tool looks. One file, one place, so the committed
# header and a hand-run regeneration cannot come from two configurations.

language = "C"
pragma_once = false
include_guard = "CONFORM_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "both"
tab_width = 4
line_length = 100

# Deliberately NOT `include_version`. Stamping the generator's version into the
# header would make `tests/the_header_matches_the_library.rs` fail on a
# `cbindgen` bump that changed nothing about the ABI, and a drift test that
# cries wolf is a drift test somebody disables.
include_version = false

header = """
/*
 * conform.h — the C ABI of `conform-ffi`.
 *
 * GENERATED by cbindgen from crates/conform-ffi/src. Do not edit by hand:
 * `crates/conform-ffi/tests/the_header_matches_the_library.rs` regenerates
 * this file and fails if it differs from the committed copy, so an edit here
 * is an edit that will be reverted by CI rather than one that will be kept.
 *
 * To change it, change the Rust and run:
 *
 *     cargo test -p conform-ffi --features header-check
 *
 * which prints the difference, then re-run with CONFORM_UPDATE_HEADER=1 to
 * write it.
 *
 * SPDX-License-Identifier: MIT OR Apache-2.0
 */
"""

autogen_warning = ""

# `size_t`, not `uintptr_t`. They are the same width everywhere this will
# plausibly run, but a length is a `size_t` in every C API a caller already
# knows, and the header should read like one of those.
usize_is_size_t = true

[parse]
# Only this crate. The adapters underneath it expose no C ABI and parsing them
# would put their private type names into a header nobody can use them from.
parse_deps = false

[export]
item_types = ["enums", "structs", "opaque", "functions", "constants"]

# `SCHEMA_VERSION` is a fine name inside a Rust crate and a poor one for a
# macro in a C header, where it shares a namespace with every other header the
# program includes. Renamed rather than dropped, because a consumer wants it:
# it is how a caller decides whether it can parse the JSON it gets back.
[export.rename]
SCHEMA_VERSION = "CONFORM_SCHEMA_VERSION"

[enum]
prefix_with_name = false
rename_variants = "QualifiedScreamingSnakeCase"

[fn]
sort_by = "None"

[const]
allow_static_const = true
