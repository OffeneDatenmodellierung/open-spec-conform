[package]
name = "conform-model-cads"

# LITERAL version, deliberately not `version.workspace = true`.
#
# The workspace provides no `[workspace.package] version` to inherit: every
# crate in this family releases on its own cadence, because each tracks a
# different upstream on a different release cycle and consumers must be able to
# pin one without pinning the rest (plan §7.2, spec FR-011). This crate tracks
# CADS, a first-party specification whose source of record is `data-modelling-sdk`.
version = "0.1.0"

description = "Typed Rust model of the Compute Asset Description Specification (CADS) v1.0, with lossless round-trip of unmodelled fields."
readme = "README.md"
keywords = ["cads", "compute-asset", "ai-model", "model", "serde"]
categories = ["data-structures", "encoding"]

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[features]
default = []
# YAML convenience constructors on the document root. See the identical
# feature on `conform-model-odcs` for why `serde_norway` and not `serde_yaml`.
yaml = ["dep:serde_norway"]

[dependencies]
serde = { version = "1", features = ["derive"] }

# Carries `customProperties`, which CADS leaves entirely untyped, and every key
# this model does not name.
serde_json = "1"

# `extra` maps are `IndexMap`, not `HashMap`, so a document's unmodelled keys
# come back out in the order it carried them.
indexmap = { version = "2", features = ["serde"] }

serde_norway = { version = "0.9", optional = true }

[dev-dependencies]
serde_norway = "0.9"

[lints]
workspace = true
