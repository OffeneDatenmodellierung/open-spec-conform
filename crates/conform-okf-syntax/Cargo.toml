[package]
name = "conform-okf-syntax"

# LITERAL version, deliberately not `version.workspace = true`.
#
# The workspace provides no `[workspace.package] version` to inherit: every
# crate in this family releases on its own cadence, because each tracks a
# different upstream on a different release cycle and consumers must be able to
# pin one without pinning the rest (plan §7.2, spec FR-011). A member that
# writes `version.workspace = true` does not build here, which is the point.
#
# `0.1.0` and not `0.1.2`. The code below was published elsewhere as
# `rto-okf-syntax 0.1.1` (see the provenance note under `[dependencies]`), and
# it would be tempting to continue that number. It is a different crate: a new
# name on crates.io, a new registry entry, a version history that starts here,
# and — unlike its ancestor — a sibling of the `conform-*` family whose cadence
# it now shares. Continuing somebody else's numbering across a rename claims a
# release history this name has not had. `0.x` is also the honest promise for a
# crate whose API deliberately mirrors upstream's and is free to move with it.
version = "0.1.0"

description = "Syntax checking for fenced code blocks in Open Knowledge Format bundles. A pure-Rust core with every code parser behind a feature, so a consumer chooses what it is willing to compile."
readme = "README.md"
keywords = ["okf", "syntax", "markdown", "linting", "sql"]
categories = ["development-tools", "parser-implementations"]

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[features]
# Both backends on. `sql` is in the default set even though it is the more
# expensive one, because SQL is 81 of the 82 tagged code blocks in the published
# OKF corpus — a build without it cannot check the only language that actually
# occurs.
#
# `conform-okf` takes this crate with `default-features = false` and re-exposes
# each backend as a feature of its own, so enabling syntax checking there costs
# nothing beyond this crate until a parser is asked for by name.
default = ["grammars", "sql"]

# tree-sitter backends for Python, JavaScript, TypeScript, Rust and Bash.
#
# Cheap *here* and not necessarily elsewhere: tree-sitter grammars compile C, so
# a consumer who wants no C toolchain — upstream's `okf-*` crates describe
# themselves as pure Rust — can leave this off and keep the core.
#
# The trade is error tolerance. tree-sitter never refuses input; it marks what it
# could not fit. That fails toward *accepting* invalid code rather than rejecting
# valid code, which is the right direction for checking somebody else's
# documentation and the one §11 asks for. Measured in `tests/accuracy.rs`.
#
# **SQL is deliberately not in this list** — see the `sql` feature.
grammars = [
    "dep:tree-sitter",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
]

# SQL, via `sqlparser`. The **only** SQL backend, and the reason is measured.
#
# This started life as `strict-sql`, an optional accuracy upgrade over
# `tree-sitter-sequel`. Running both over all four bundles published in the OKF
# specification repository at `ad30107` inverted that: the grammar rejects
# **78 of 78** SQL blocks, because it cannot parse BigQuery's backtick-quoted
# identifiers — `FROM \`bigquery-public-data.crypto_bitcoin.inputs\`` — which is
# how essentially every query in the corpus names its table. `sqlparser` rejects
# 6, all of them documentation *fragments* (a bare `ON` clause, a bare
# `SAFE_DIVIDE(...)`), and passes both real Attested Computations.
#
# So `tree-sitter-sequel` is not a weaker option, it is an unusable one for this
# format, and it has been dropped rather than left as a fallback: a fallback
# that reports 78 false errors is worse than reporting "not checked".
#
# The price is ~17 crates including `stacker`/`psm`, which compile assembly.
# That is the cost of checking the one language OKF actually uses.
sql = ["dep:sqlparser"]

# The dependency list is the contract, not an implementation detail. This crate
# exists *because* `okf-validator` could not be taken: its `rustpython-parser`
# tree is 61 crates carrying LGPL-3.0-only and six unmaintained advisories, to
# serve one 129-line file in the entire published corpus. A replacement is only
# worth having while it stays clean, so `dependencies_are_frozen` in
# `src/lib.rs` asserts this list verbatim and widening it is a deliberate edit
# to a test rather than a `cargo add`.
#
# **The core is pure Rust and parses no code.** With `--no-default-features`
# this crate compiles no grammar, invokes no C toolchain, and still does the
# work that needs no parser: lifting fenced blocks out of markdown, and checking
# JSON, YAML and shell quoting. `serde_json` and `okf-core` are both pure Rust
# and `okf-core` has zero dependencies of its own; YAML deliberately goes
# through the same parser that read the frontmatter, so a document cannot fail
# because two YAML implementations disagreed.
#
# # Provenance
#
# This crate is a port of `rto-okf-syntax` from the Roteiro repository at commit
# `8817904e`, path `crates/rto-okf-syntax/`, published to crates.io as
# `rto-okf-syntax 0.1.1` under `MIT OR Apache-2.0` — the same terms this
# workspace uses, by the same author, so no licence question arises. That
# crate's own manifest described it as "written to be *given away*" and said it
# "may be deleted outright if upstream adopts it". Under `docs/findings/
# 0003-dependency-direction.md` this repository is the upstream Roteiro
# inherits from, so it moves here and Roteiro's copy is deleted on adoption.
#
# `okf-core` is pinned at `0.2.7` rather than the `0.2.6` it arrived on, so the
# workspace carries exactly one version of it — `conform-okf` already depends on
# `0.2.7` and two copies of the model in one graph is the shape this project
# does not ship.
[dependencies]
okf-core = "0.2.7"
serde_json = "1"

# Everything that parses a programming language is optional, including
# tree-sitter. See `[features]` for what each one buys and what it costs.
tree-sitter = { version = "0.26.12", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
sqlparser = { version = "0.62", optional = true }

# `syn` is a dev-dependency only, and only to keep one claim honest:
# `a_strict_rust_parser_would_be_worse_here` measures that `syn::parse_file`
# rejects `let x = 1;` while this crate accepts it. That is the whole reason a
# `strict-rust` feature does not exist, and an argument that load-bearing should
# be a test rather than a comment. It is already in this workspace's lockfile —
# `serde_derive` pulls it — so it costs nothing.
[dev-dependencies]
syn = { version = "3", features = ["full", "parsing"] }

[lints]
workspace = true
