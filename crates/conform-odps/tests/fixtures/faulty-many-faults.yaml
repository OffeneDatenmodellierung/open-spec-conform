# Deliberately many independent faults, of several different classes. This is
# the fixture behind `tests/more_than_one_problem.rs`: the capability a
# `Result<(), String>` cannot express is reporting all of these at once.
#
#   1. `apiVersion` is `v2.0.0`, which is not in the enum        -> ODPS103
#   2. `kind` is `DataContract`, and the enum permits only
#      `DataProduct`                                             -> ODPS103
#   3. `status` is required and absent                           -> ODPS101
#   4. `id` is a number where the schema requires a string       -> ODPS104
#   5. `product_status` is not a property the schema knows       -> ODPS102
#   6. `inputPorts[0]` is missing `version` and `contractId`     -> ODPS101
#   7. `outputPorts[0]` carries a key the port does not permit   -> ODPS102
#   8. `tags` is a string where the schema requires an array     -> ODPS104
apiVersion: v2.0.0
kind: DataContract
id: 4815162342
product_status: active
tags: sales
inputPorts:
  - name: raw-orders
outputPorts:
  - name: orders_gold
    version: 1.0.0
    refreshCadence: hourly
