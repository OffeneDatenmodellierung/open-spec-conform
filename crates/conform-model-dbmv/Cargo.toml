[package]
name = "conform-model-dbmv"

# LITERAL version, deliberately not `version.workspace = true`.
#
# The workspace provides no `[workspace.package] version` to inherit: every
# crate in this family releases on its own cadence, because each tracks a
# different upstream on a different release cycle and consumers must be able to
# pin one without pinning the rest (plan §7.2, spec FR-011). This crate tracks
# the Databricks Metric Views format, which moves on Databricks's schedule.
version = "0.1.0"

description = "Typed Rust model of the Databricks Metric Views (DBMV) document format, with lossless round-trip of unmodelled fields."
readme = "README.md"
keywords = ["databricks", "metric-view", "semantic-layer", "model", "serde"]
categories = ["data-structures", "encoding"]

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[features]
default = []
# YAML convenience constructors on the document root. See the identical
# feature on `conform-model-odcs` for why `serde_norway` and not `serde_yaml` -- which is
# what the upstream model used, and which `cargo deny` rejects here.
yaml = ["dep:serde_norway"]

[dependencies]
serde = { version = "1", features = ["derive"] }

# Carries every key this model does not name. DBMV has no untyped value of its
# own; this is the round-trip guarantee and nothing else.
serde_json = "1"

# `extra` maps are `IndexMap`, not `HashMap`, so a document's unmodelled keys
# come back out in the order it carried them.
indexmap = { version = "2", features = ["serde"] }

serde_norway = { version = "0.9", optional = true }

[dev-dependencies]
serde_norway = "0.9"

[lints]
workspace = true
